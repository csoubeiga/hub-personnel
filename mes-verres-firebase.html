<style>
:root{
  --bg:#F4F6F5;--card:#FFFFFF;--ink:#1C2220;--muted:#87908D;--line:#E8EBEA;
  --green:#3DAE7E;--green-d:#2A8A60;
  --red:#E63B2E;--red-d:#B3231A;
  --gray:#B3B8B6;--gray-l:#D8DBDA;--track:#EDF0EE;
  --nav-h:62px;--sync-h:24px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
body.vstats::before{background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.view{padding-bottom:calc(var(--nav-h) + var(--sync-h) + env(safe-area-inset-bottom,0px) + 24px)}
.hidden{display:none!important}

/* En-tête calendrier */
.chead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-radius:0 0 26px 26px;box-shadow:0 8px 20px rgba(28,34,32,.05);padding:14px 16px 10px}
.ctop{display:flex;align-items:center;gap:14px}
.hexbtn{width:56px;height:60px;flex:0 0 auto;border:0;background:none;padding:0}
.hexbtn svg{width:100%;height:100%;display:block}
.seg{flex:1;display:flex;background:#EFF1F0;border-radius:999px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:11px 0;font-size:17px;font-weight:500}
.seg button.on{background:var(--green);color:#fff}
.wk{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px;text-align:center;font-size:14px;font-weight:500}

/* Vue mois */
.month{padding:22px 10px 12px;border-bottom:1px solid var(--line)}
.month h3{margin:0 12px 14px;font-size:18px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}
.day{border:2px solid transparent;background:none;border-radius:24px;padding:6px 0 8px;margin:0 2px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--gray)}
.day .n{font-size:16px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.day .g{width:24px;height:30px;display:block;transition:transform .12s}
.day:active:not(:disabled) .g{transform:scale(.82)}
.day.s0{color:var(--green)}
.day.s1{color:var(--red);--bf:currentColor}
.day.su{color:var(--gray)}
.day.fut{color:var(--gray-l);cursor:default}
.day.fut .n{color:#ABB0AE}
.day.today{border-color:currentColor}
.day.su.today{border-color:var(--ink)}

/* Vue année */
.year{padding:6px 8px 18px}
.year h2{margin:16px 10px 6px;font-size:24px;font-weight:600}
.ygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px}
.mini{cursor:pointer;border-radius:12px}
.mini h4{margin:4px 0 8px;text-align:center;font-size:15px;font-weight:500}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.mc{height:19px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums}
.mc.s0{background:var(--green);color:#fff}
.mc.s1{background:var(--red);color:#fff}
.mc.L{border-radius:10px 0 0 10px;margin-left:1px}
.mc.R{border-radius:0 10px 10px 0;margin-right:1px}
.mc.L.R{border-radius:10px}
.mc.su{color:var(--muted)}
.mc.fu{color:#B5BAB8}

/* Stats */
.shead{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 2px 20px}
.shead h1{font-size:34px;font-weight:700;margin:0;letter-spacing:-.6px}
.iconbtn{width:44px;height:44px;border:0;background:none;color:var(--green);display:grid;place-items:center;border-radius:12px}
.iconbtn svg{width:26px;height:26px}
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:999px;padding:10px 16px;background:#E6E9E7;font-size:15px;font-weight:500}
.chip.on{background:var(--ink);color:#fff}
.card{background:var(--card);border-radius:24px;margin:12px 16px;padding:18px 18px 16px}
.empty{color:var(--muted);text-align:center;padding:28px 18px}
.gauge svg{width:100%;height:auto;display:block}
.glabel{text-align:center;margin-top:4px;font-size:15px;color:var(--muted);line-height:1.5}
.glabel b{display:block;color:var(--ink);font-weight:600;font-size:19px}
.row{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.dot svg{width:20px;height:26px}
.row .t{font-size:16px;line-height:1.35}
.row .t b{font-size:22px;font-weight:600;margin:0 2px}
.row .t small{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden;margin:0 0 18px}
.bar:last-child{margin-bottom:4px}
.bar i{display:block;height:100%;border-radius:8px}
.note{margin:-2px 22px 0;font-size:13px;color:var(--muted);line-height:1.45}
.ctitle{font-size:16px;font-weight:500;text-align:center;margin:2px 0 16px;line-height:1.4}
.ctitle b{font-size:20px;font-weight:600}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dows svg{width:100%;max-width:46px;height:auto;display:block;margin:0 auto}
.dows .c{font-size:14px;font-weight:600;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:5px;padding-top:4px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.cnt{font-size:11px;color:var(--muted);height:16px;font-variant-numeric:tabular-nums}
.trk{width:100%;max-width:20px;background:var(--track);border-radius:10px;overflow:hidden;display:flex;align-items:flex-end}
.fill{width:100%;background:var(--red);border-radius:10px}
.mlbl{font-size:13px;font-weight:500;margin-top:6px}
.ylbl{font-size:10px;color:var(--muted);height:14px;white-space:nowrap}
.rech{font-size:24px;font-weight:700;margin:28px 20px 12px;letter-spacing:-.3px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.rec{border-radius:24px;padding:14px 18px 18px;color:#fff}
.rec.g{background:#5BB892}
.rec.r{background:var(--red)}
.rec b{display:block;font-size:56px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rec span{font-size:15px;font-weight:500;line-height:1.3;display:block;margin-top:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line);margin:-4px -4px 18px}
.tabs button{border:0;background:none;padding:12px 0;font-size:16px;font-weight:500;color:var(--gray);position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;border-radius:3px;background:var(--green)}
.tabs button.r.on::after{background:var(--red)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 6px;text-align:center}
.bitem svg{width:66px;height:73px;display:block;margin:0 auto 6px}
.bd{font-size:12px;color:var(--muted)}
.bt{font-size:14px;font-weight:600;margin:2px 0}
.bs{font-size:12px;color:var(--muted)}
.bsec{grid-column:1/-1;text-align:left;font-size:15px;font-weight:600;margin:10px 0 -4px}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--gray)}
.nav button svg{width:27px;height:27px}
.nav button.on{color:var(--ink)}

/* Réglages et toast */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,26,24,.35);display:flex;align-items:flex-end}
.pane{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.pane h2{margin:0 0 4px;font-size:21px}
.pane p{color:var(--muted);font-size:14px;margin:4px 0 14px;line-height:1.45}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:500;background:#EEF0EF;margin:8px 0}
.btn.pri{background:var(--ink);color:#fff}
.btn.dng{background:#FDECEA;color:var(--red-d)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical;background:#FAFBFA;color:var(--ink);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sync-h) + env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast,.day .g{transition:none}}

/* Hub : lien retour, barre de synchro, confirmation en deux temps */
.hub{display:inline-block;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:0 0 10px}
.hub-s{margin:14px 20px 0}
.sync{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));height:var(--sync-h);z-index:29;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;background:#EEF1EF;color:var(--muted);border-top:1px solid var(--line)}
.sync.ok{color:var(--green-d)}
.sync.err{background:#FDECEA;color:var(--red-d)}
.btn.armed{background:var(--red);color:#fff}
</style>
</head>
<body class="vcal">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="glass" viewBox="0 0 24 30">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>

<div class="sync" id="sync">Chargement…</div>
<nav class="nav">
  <button id="nC" type="button" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Calendrier</span>
  </button>
  <button id="nS" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l3.6-5.2"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/></svg>

</nav>

<div class="sheet hidden" id="sheet">
  <div class="pane" role="dialog" aria-label="Réglages">
    <h2>Réglages</h2>
    <p id="info"></p>
    <button class="btn pri" id="exp" type="button">Exporter mes données</button>
    <textarea id="ta" placeholder="Colle ici une sauvegarde pour l’importer"></textarea>
    <button class="btn" id="cpy" type="button">Copier le texte</button>

</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ---------- Firebase ---------- */
const FB_CONFIG = {
  apiKey: "AIzaSyC9qSli9HAWsM5mcEMjW5fEhgTQmrdR3TA",
  authDomain: "hub-personnel-firebase.firebaseapp.com",
  projectId: "hub-personnel-firebase",
  storageBucket: "hub-personnel-firebase.firebasestorage.app",
  messagingSenderId: "394129070920",
  appId: "1:394129070920:web:10f3303c22adcda47cf17d"
};
firebase.initializeApp(FB_CONFIG);
const DB = firebase.firestore();
const DOC = DB.collection('mes-verres').doc('data');
/* Document plat : 'YYYY-MM-DD' -> 0 (sans alcool) | 1 (avec alcool), plus 'meta:seedV' et 'meta:hint'. */
const CACHE_KEY = 'mes-verres-cache';
const SEED_V = 2;
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;

const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MOISC = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JL = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const JC = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const GL = ['Très rarement','Rarement','Régulièrement','Souvent','Très souvent'];

/* Historique transcrit depuis l'ancienne app : jours AVEC alcool par mois.
   Les autres jours de ces mois sont SANS alcool.
   20 avril au 30 septembre 2026 (hors juin et 28 juil.-4 août) : reconstitution sous contraintes
   (totaux mensuels, jours de semaine, séries), pas les jours réels. */
const SEED = {
'2025-01':[1,2,3,4,5,6,9,11,12,13,15,18,19,23,24,25,26,31],
'2025-02':[1,4,6,7,8,9,14,15,16,18,21,22,25,28],

'2025-06':[1,2,3,13,14,15,20,21,22,25,26,27,28,29,30],

'2025-10':[4,5,11,18,19,21,23,25,31],

};
const SEED_END = '2026-11-08';

/* ---------- Dates (toujours en heure locale) ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function K(y, m, d){ return y + '-' + pad(m + 1) + '-' + pad(d); }
function key(dt){ return K(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
function parse(k){ const p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function add(dt, n){ return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n); }
function today(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function dim(y, m){ return new Date(y, m + 1, 0).getDate(); }
function wd(dt){ return (dt.getDay() + 6) % 7; }
function fmt(dt){ return dt.getDate() + ' ' + MOIS[dt.getMonth()].toLowerCase() + ' ' + dt.getFullYear(); }
function fmtShort(dt){ const j = JL[wd(dt)]; return j.charAt(0).toUpperCase() + j.slice(1, 3) + '. ' + dt.getDate() + ' ' + MOISC[dt.getMonth()]; }
function plural(n, w){ return n + ' ' + w + (n > 1 ? 's' : ''); }
function $(s){ return document.querySelector(s); }

/* ---------- État ---------- */
let days = {};
let meta = { seedV: 0, hint: 0 };
let pending = {};          // clé -> 0 | 1 | null (null = suppression), en attente d'envoi
let fullWrite = false;     // vrai après import ou effacement : réécrit tout le document
let saveTimer = null, retryTimer = null, loadRetryTimer = null;
let loaded = false, booted = false;

function buildSeed(){
  const out = {};
  Object.keys(SEED).forEach(function seedMonth(ym){
    const y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1, reds = SEED[ym], n = dim(y, m);
    for (let d = 1; d <= n; d++){
      const k = K(y, m, d);
      if (k > SEED_END) break;
      out[k] = reds.indexOf(d) >= 0 ? 1 : 0;
    }
  });
  return out;
}
function st(k){ const v = days[k]; return v === 0 || v === 1 ? v : undefined; }
function firstDate(){ const ks = Object.keys(days); if (!ks.length) return null; ks.sort(); return parse(ks[0]); }

/* ---------- Synchronisation Firestore ---------- */
function setStatus(s){
  const el = $('#sync');
  el.className = 'sync' + (s === 'ok' ? ' ok' : s === 'err' ? ' err' : '');
  el.textContent = s === 'loading' ? 'Chargement…' : s === 'saving' ? 'Enregistrement…' : s === 'ok' ? '✓ Synchronisé' : '⚠ Erreur de synchro, nouvel essai dans 5 s';
}
function cacheLocal(){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ days: days, meta: meta, pending: pending, fullWrite: fullWrite })); } catch (e) { /* stockage local indisponible */ }
}
function readCache(){
  try { const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function fullObject(){
  const o = {};
  Object.keys(days).forEach(function copyDay(k){ o[k] = days[k]; });
  o['meta:seedV'] = meta.seedV;
  o['meta:hint'] = meta.hint;
  return o;
}
function parseDoc(data){
  days = {};
  meta = { seedV: 0, hint: 0 };
  Object.keys(data).forEach(function readField(k){
    const v = data[k];
    if (DAY_RE.test(k)) { if (v === 0 || v === 1) days[k] = v; }
    else if (k === 'meta:seedV') meta.seedV = +v || 0;
    else if (k === 'meta:hint') meta.hint = +v || 0;
  });
}
function queue(k, v){ pending[k] = v; scheduleSave(); }
function requestFullWrite(){ fullWrite = true; pending = {}; scheduleSave(); }
function scheduleSave(){ cacheLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1200); }
function flush(){
  clearTimeout(saveTimer); clearTimeout(retryTimer);
  if (!loaded) return;
  if (!fullWrite && !Object.keys(pending).length) return;
  const sentPending = pending, sentFull = fullWrite;
  pending = {}; fullWrite = false;
  setStatus('saving');
  let op;
  if (sentFull) op = DOC.set(fullObject());
  else {
    const obj = {};
    Object.keys(sentPending).forEach(function toField(k){
      obj[k] = sentPending[k] === null ? firebase.firestore.FieldValue.delete() : sentPending[k];
    });
    op = DOC.set(obj, { merge: true });
  }
  op.then(function onSaved(){
    cacheLocal();
    if (fullWrite || Object.keys(pending).length) scheduleSave(); else setStatus('ok');
  }).catch(function onSaveError(err){
    console.error('Sauvegarde Firestore', err);
    if (sentFull) fullWrite = true;
    Object.keys(sentPending).forEach(function requeue(k){ if (!(k in pending)) pending[k] = sentPending[k]; });
    cacheLocal();
    setStatus('err');
    retryTimer = setTimeout(flush, 5000);
  });
}
function migrateSeed(){
  if (meta.seedV >= SEED_V) return;
  const sd = buildSeed();
  Object.keys(sd).forEach(function addMissing(k){ if (st(k) === undefined){ days[k] = sd[k]; pending[k] = sd[k]; } });
  meta.seedV = SEED_V; pending['meta:seedV'] = SEED_V;
}
function applyCache(cache){
  if (!cache) return;
  if (cache.fullWrite && cache.days){ days = cache.days; meta = cache.meta || meta; fullWrite = true; pending = {}; return; }
  if (cache.pending){
    Object.keys(cache.pending).forEach(function reapply(k){
      const v = cache.pending[k];
      if (DAY_RE.test(k)) { if (v === null) delete days[k]; else days[k] = v; }
      else if (k === 'meta:hint') meta.hint = +v || 0;
      pending[k] = v;
    });
  }
}
function loadData(){
  clearTimeout(loadRetryTimer);
  setStatus('loading');
  const cache = readCache();
  return DOC.get().then(function onDoc(snap){
    pending = {}; fullWrite = false;
    if (snap.exists) parseDoc(snap.data());
    else { days = buildSeed(); meta = { seedV: SEED_V, hint: 0 }; fullWrite = true; }
    applyCache(cache);   // modifs faites hors connexion et pas encore envoyées
    migrateSeed();
    loaded = true;
    cacheLocal();
    if (fullWrite || Object.keys(pending).length) flush(); else setStatus('ok');
  }).catch(function onLoadError(err){
    console.error('Lecture Firestore', err);
    if (cache && cache.days){ days = cache.days; meta = cache.meta || meta; pending = cache.pending || {}; fullWrite = !!cache.fullWrite; }
    else if (!loaded){ days = buildSeed(); meta = { seedV: SEED_V, hint: 0 }; }
    loaded = true;
    setStatus('err');
    loadRetryTimer = setTimeout(function retryLoad(){ loadData().then(render); }, 5000);
  });
}

function seasonOf(m){ return [11,0,1].indexOf(m) >= 0 ? 'snow' : m <= 4 ? 'flower' : m <= 7 ? 'sun' : 'leaf'; }

function arc(cx, cy, r, a0, a1){

/* ---------- Séries ---------- */
function allRuns(){
  const f = firstDate(), T = today(), runs = [];
  let cur = null;
  if (!f) return runs;
  for (let d = f; d <= T; d = add(d, 1)){
    const s = st(key(d));
    if (s === undefined){ cur = null; continue; }
    if (cur && cur.t === s) cur.len++; else { cur = { t: s, start: d, len: 1 }; runs.push(cur); }
  }
  return runs;
}
function anchor(){ const T = today(); return st(key(T)) === undefined ? add(T, -1) : T; }
function current(runs){
  const A = anchor(), r = runs[runs.length - 1];
  return r && +add(r.start, r.len - 1) === +A ? r : null;
}

/* ---------- Calendrier ---------- */
let calMode = 'm', yearsDirty = true, statsDirty = true, renderedDay = key(today());
function dayCell(k, d, T){
  const s = st(k), fut = k > T;
  let c = fut ? 'fut' : s === 1 ? 's1' : s === 0 ? 's0' : 'su';
  if (k === T) c += ' today';
  const lab = fut ? '' : (s === 1 ? 'avec alcool' : s === 0 ? 'sans alcool' : 'non renseigné');
  return '<button type="button" class="day ' + c + '" data-k="' + k + '"' + (fut ? ' disabled' : '') + ' aria-label="' + d + (lab ? ', ' + lab : '') + '"><span class="n">' + d + '</span><svg class="g" viewBox="0 0 24 30" aria-hidden="true"><use href="#glass"/></svg></button>';
}
function monthsRange(){
  const T = today(), f = firstDate() || T, list = [];
  const s = f.getFullYear() * 12 + f.getMonth(), e = T.getFullYear() * 12 + T.getMonth() + 1;
  for (let i = s; i <= e; i++) list.push([Math.floor(i / 12), i % 12]);
  return list;
}
function renderMonths(){
  const T = key(today());
  let h = '';
  monthsRange().forEach(function monthBlock(ym){
    const y = ym[0], m = ym[1], off = wd(new Date(y, m, 1)), n = dim(y, m);
    h += '<section class="month" id="m-' + y + '-' + m + '"><h3>' + MOIS[m] + ' ' + y + '</h3><div class="grid">';
    for (let i = 0; i < off; i++) h += '<span></span>';
    for (let d = 1; d <= n; d++) h += dayCell(K(y, m, d), d, T);
    h += '</div></section>';
  });
  $('#months').innerHTML = h;
}
function renderYears(){
  const Td = today(), T = key(Td), f = firstDate() || Td;
  let h = '';
  for (let y = f.getFullYear(); y <= Td.getFullYear(); y++){
    h += '<section class="year" id="y-' + y + '"><h2>' + y + '</h2><div class="ygrid">';
    for (let m = 0; m < 12; m++){
      const off = wd(new Date(y, m, 1)), n = dim(y, m);
      h += '<div class="mini" role="button" tabindex="0" data-ym="' + y + '-' + m + '"><h4>' + MOIS[m] + '</h4><div class="mgrid">';
      for (let i = 0; i < off; i++) h += '<span></span>';
      for (let d = 1; d <= n; d++){
        const k = K(y, m, d);
        let c = 'mc';
        if (k > T) c += ' fu';
        else {
          const s = st(k);
          if (s === undefined) c += ' su';
          else {
            const col = (off + d - 1) % 7;
            const ls = col > 0 && d > 1 && st(K(y, m, d - 1)) === s;
            const rs = col < 6 && d < n && K(y, m, d + 1) <= T && st(K(y, m, d + 1)) === s;
            c += ' s' + s + (ls ? '' : ' L') + (rs ? '' : ' R');
          }
        }
        h += '<span class="' + c + '">' + d + '</span>';
      }
      h += '</div></div>';
    }
    h += '</div></section>';
  }
  $('#years').innerHTML = h;
  yearsDirty = false;
}
function renderHex(){
  const c = current(allRuns()), n = c ? c.len : 0, t = c ? c.t : null;
  $('#hex').innerHTML = hexSVG(String(n), t === 0 ? C0 : t === 1 ? C1 : ['#B9BDBC','#9DA3A1']);
  $('#hex').setAttribute('data-msg', c ? 'Série en cours : ' + plural(n, 'jour') + (t === 0 ? ' sans alcool' : ' avec alcool') : 'Pas de série en cours');
}
function safeTop(){ return parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0; }
function scrollToEl(el){
  if (!el) return;
  const hh = $('.chead').offsetHeight;
  window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - hh - safeTop() + 4));
}
function scrollToday(){
  const T = today();

  if (calMode === 'm') scrollToEl(document.getElementById('m-' + T.getFullYear() + '-' + T.getMonth()));

  calMode = m;

  $('#wk').classList.toggle('hidden', m !== 'm');
  $('#months').classList.toggle('hidden', m !== 'm'); $('#years').classList.toggle('hidden', m !== 'y');
  if (m === 'y' && yearsDirty) renderYears();

function cycle(btn){
  if (!loaded){ toast('Chargement en cours…'); return; }
  const k = btn.getAttribute('data-k'), s = st(k), n = s === undefined ? 0 : s === 0 ? 1 : null;
  if (n === null) delete days[k]; else days[k] = n;
  queue(k, n);
  const d = parse(k);
  btn.outerHTML = dayCell(k, d.getDate(), key(today()));
  renderHex();
  yearsDirty = statsDirty = true;
  toast(fmtShort(d) + ' : ' + (n === 0 ? 'sans alcool' : n === 1 ? 'avec alcool' : 'non renseigné'));
}

const PERIODS = [['all','Tout le temps'],['30','30 jours'],['cm','Ce mois'],['pm','Le mois dernier'],['100','100 jours'],['365','365 jours'],['cy','Cette année'],['py','L’année dernière']];
let period = 'all', btab = 0;
function periodRange(p){
  const T = today(), y = T.getFullYear(), m = T.getMonth(), f = firstDate();
  let a, b = T, ym = null;
  if (p === 'all') a = f || T;
  else if (p === '30') a = add(T, -29);
  else if (p === '100') a = add(T, -99);
  else if (p === '365') a = add(T, -364);
  else if (p === 'cm') a = new Date(y, m, 1);
  else if (p === 'pm'){ a = new Date(y, m - 1, 1); b = new Date(y, m, 0); }
  else if (p === 'cy'){ a = new Date(y, 0, 1); ym = y; }
  else { a = new Date(y - 1, 0, 1); b = new Date(y - 1, 11, 31); ym = y - 1; }
  if (f && a < f) a = f;
  return { a: a, b: b, ym: ym };
}
function scan(a, b){
  const x = { total: 0, sans: 0, avec: 0, dowA: [0,0,0,0,0,0,0], dowK: [0,0,0,0,0,0,0], mA: {}, mK: {}, bestS: 0, bestA: 0 };
  let ct = null, cl = 0;
  for (let d = a; d <= b; d = add(d, 1)){
    x.total++;
    const s = st(key(d)), w = wd(d), mi = d.getFullYear() * 12 + d.getMonth();
    if (s === undefined){ ct = null; cl = 0; continue; }
    x.dowK[w]++; x.mK[mi] = (x.mK[mi] || 0) + 1;
    if (s === 1){ x.avec++; x.dowA[w]++; x.mA[mi] = (x.mA[mi] || 0) + 1; } else x.sans++;
    if (ct === s) cl++; else { ct = s; cl = 1; }
    if (s === 0) x.bestS = Math.max(x.bestS, cl); else x.bestA = Math.max(x.bestA, cl);
  }
  x.known = x.sans + x.avec;
  return x;
}
function splitRow(t, v, n){

const MILES = [[7,'7','7 jours'],[14,'14','14 jours'],[21,'21','21 jours'],[30,'30','30 jours'],[60,'60','60 jours'],[100,'100','100 jours'],[182,'182','Six mois'],[365,'365','Un an'],[1000,'1K','1000 jours']];
const SEASONS = [

  ['Printemps','flower',function printemps(y){ return [new Date(y, 2, 1), new Date(y, 5, 0)]; }],

function rangeState(a, b, t){
  const T = today();
  for (let d = a; d <= b; d = add(d, 1)){
    if (d > T) return 'open';
    const s = st(key(d));
    if (s === t) continue;
    if (+d === +T && s === undefined) return 'open';
    return 'broken';
  }
  return 'done';
}
function calBadge(t, rangeFn){
  const T = today(), f = firstDate(), y0 = (f || T).getFullYear();
  let n = 0, last = null, next = null;
  for (let y = y0; y <= T.getFullYear() + 2; y++){
    const r = rangeFn(y), s = rangeState(r[0], r[1], t);
    if (s === 'done'){ n++; last = r[1]; } else if (s === 'open' && !next) next = r[1];
  }
  return { n: n, date: n ? last : next };
}

  return h + '</div>';
}
function renderChips(){
  $('#chips').innerHTML = PERIODS.map(function chip(p){ return '<button type="button" class="chip' + (p[0] === period ? ' on' : '') + '" data-p="' + p[0] + '">' + p[1] + '</button>'; }).join('');
}
function renderStats(){
  const pr = periodRange(period), x = pr.a > pr.b ? null : scan(pr.a, pr.b);
  let h = '';
  if (x && x.known > 0){
    const pct = x.avec / x.known, li = Math.min(4, Math.floor(pct * 5));
    h += '<div class="card gauge">' + gaugeSVG(pct) + '<div class="glabel"><b>' + GL[li] + '</b>' + Math.round(pct * 100) + '\u00A0% des jours avec alcool</div></div>';
    h += '<div class="card">' + splitRow(0, x.sans, x.known) + splitRow(1, x.avec, x.known) + '</div>';
    const unk = x.total - x.known;
    if (unk > 0) h += '<p class="note">' + plural(unk, 'jour') + ' non renseigné' + (unk > 1 ? 's' : '') + ' sur la période, exclu' + (unk > 1 ? 's' : '') + ' des calculs.</p>';
    let mx = 0, mi = 0;
    for (let i = 0; i < 7; i++) if (x.dowA[i] > mx){ mx = x.dowA[i]; mi = i; }
    h += '<div class="card"><div class="ctitle">' + (mx ? 'Tu bois le plus souvent le ' + JL[mi] : 'Aucun jour avec alcool sur la période') + '</div><div class="dows">';
    for (let j = 0; j < 7; j++) h += '<div>' + ring(x.dowK[j] ? x.dowA[j] / x.dowK[j] : 0, JC[j]) + '<div class="c">' + x.dowA[j] + '</div></div>';
    h += '</div></div>';
    const avg = Math.round(x.avec / (x.known / 30.44));
    h += '<div class="card"><div class="ctitle">En moyenne avec alcool<br><b>' + plural(avg, 'jour') + ' par mois</b></div>' + chartHTML(pr, x) + '</div>';
    h += '<h2 class="rech">Mes records sur ' + x.total + ' jours</h2><div class="recs"><div class="rec g"><b>' + x.bestS + '</b><span>' + (x.bestS > 1 ? 'jours' : 'jour') + ' d’affilée sans alcool</span></div><div class="rec r"><b>' + x.bestA + '</b><span>' + (x.bestA > 1 ? 'jours' : 'jour') + ' d’affilée avec alcool</span></div></div>';
  } else h += '<div class="card empty">' + (loaded ? 'Aucun jour renseigné sur cette période.' : 'Chargement…') + '</div>';
  h += '<h2 class="rech">Séries et paliers</h2><div class="card"><div class="tabs"><button type="button" data-tab="0" class="' + (btab === 0 ? 'on' : '') + '">Sans alcool</button><button type="button" data-tab="1" class="r' + (btab === 1 ? ' on' : '') + '">Avec alcool</button></div>' + badgesHTML(allRuns(), btab) + '</div>';
  $('#sbody').innerHTML = h;
  statsDirty = false;
}

/* ---------- Rendu global et navigation ---------- */
let view = 'cal';
const scrollMem = { cal: 0, stats: 0 };
function render(){
  renderHex(); renderMonths(); renderChips();
  yearsDirty = statsDirty = true;
  if (view === 'stats') renderStats();
  if (calMode === 'y') renderYears();
}
function showView(v){
  if (v === view) return;
  scrollMem[view] = window.scrollY; view = v;
  $('#v-cal').classList.toggle('hidden', v !== 'cal'); $('#v-stats').classList.toggle('hidden', v !== 'stats');
  $('#nC').classList.toggle('on', v === 'cal'); $('#nS').classList.toggle('on', v === 'stats');
  document.body.className = v === 'cal' ? 'vcal' : 'vstats';
  if (v === 'stats' && statsDirty) renderStats();
  if (v === 'cal' && calMode === 'y' && yearsDirty) renderYears();
  window.scrollTo(0, scrollMem[v] || 0);
}
let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function hideToast(){ el.classList.remove('on'); }, 1800);
}

/* ---------- Réglages (confirmation en deux temps, sans fenêtre système) ---------- */
let armedBtn = null, armTimer = null;
function disarm(){
  clearTimeout(armTimer);
  if (armedBtn){ armedBtn.textContent = armedBtn.getAttribute('data-label'); armedBtn.classList.remove('armed'); armedBtn = null; }
}
function armOrRun(btn, question, action){
  if (armedBtn === btn){ disarm(); action(); return; }
  disarm();
  armedBtn = btn;
  if (!btn.getAttribute('data-label')) btn.setAttribute('data-label', btn.textContent);
  btn.textContent = question;
  btn.classList.add('armed');
  armTimer = setTimeout(disarm, 4000);
}
function openSheet(){
  const n = Object.keys(days).length, f = firstDate();
  $('#info').textContent = n ? plural(n, 'jour') + ' renseigné' + (n > 1 ? 's' : '') + ' depuis le ' + fmt(f) + '. Tes données sont synchronisées dans ton hub ; l’export sert de sauvegarde ou de transfert.' : 'Aucune donnée pour l’instant.';
  $('#ta').value = '';
  disarm();
  $('#sheet').classList.remove('hidden');
}
function closeSheet(){ disarm(); $('#sheet').classList.add('hidden'); }
function parseImport(txt){
  let o;
  try { o = JSON.parse(txt); } catch (e) { return null; }
  const d = o && o.days ? o.days : o, clean = {};
  if (!d || typeof d !== 'object') return null;
  Object.keys(d).forEach(function keepValid(k){ if (DAY_RE.test(k) && (d[k] === 0 || d[k] === 1)) clean[k] = d[k]; });
  return Object.keys(clean).length ? clean : null;
}

/* ---------- Handlers ---------- */
function onMonthsClick(e){ const b = e.target.closest('.day'); if (b && !b.disabled) cycle(b); }
function openMini(el){ const p = el.getAttribute('data-ym').split('-'); setCalMode('m'); scrollToEl(document.getElementById('m-' + p[0] + '-' + p[1])); }
function onYearsClick(e){ const el = e.target.closest('.mini'); if (el) openMini(el); }
function onYearsKey(e){ if (e.key === 'Enter'){ const el = e.target.closest('.mini'); if (el) openMini(el); } }
function onModeMonth(){ setCalMode('m'); }
function onModeYear(){ setCalMode('y'); }
function onHexClick(){ toast($('#hex').getAttribute('data-msg')); }
function onNavCal(){ showView('cal'); }
function onNavStats(){ showView('stats'); }
function onChipsClick(e){ const b = e.target.closest('.chip'); if (!b) return; period = b.getAttribute('data-p'); renderChips(); renderStats(); }
function onStatsClick(e){ const b = e.target.closest('[data-tab]'); if (!b) return; btab = +b.getAttribute('data-tab'); renderStats(); }
function onSheetBackdrop(e){ if (e.target === $('#sheet')) closeSheet(); }
function onExport(){
  $('#ta').value = JSON.stringify({ app: 'mes-verres', v: 1, exporte: new Date().toISOString(), days: days });
  toast('Données prêtes : copie le texte');
}
function onCopy(){
  const ta = $('#ta');
  if (!ta.value){ toast('Rien à copier : exporte d’abord'); return; }
  function fallbackCopy(){ ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Copié'); } catch (e) { toast('Sélectionne et copie le texte'); } }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function copied(){ toast('Copié'); }, fallbackCopy);
  else fallbackCopy();
}
function onImport(){
  const btn = $('#imp'), v = $('#ta').value.trim();
  if (!v){ disarm(); toast('Colle d’abord une sauvegarde'); return; }
  const clean = parseImport(v);
  if (!clean){ disarm(); toast('Texte illisible : colle une sauvegarde complète'); return; }
  const n = Object.keys(clean).length;
  armOrRun(btn, 'Remplacer par ' + plural(n, 'jour') + ' : touche encore', function doImport(){
    days = clean; requestFullWrite(); render(); closeSheet();
    toast(plural(n, 'jour') + ' importé' + (n > 1 ? 's' : ''));
  });
}
function onReseed(){
  if (!loaded){ toast('Chargement en cours…'); return; }
  const sd = buildSeed();
  let n = 0;
  Object.keys(sd).forEach(function fillMissing(k){ if (st(k) === undefined){ days[k] = sd[k]; pending[k] = sd[k]; n++; } });
  if (n) scheduleSave();
  render();
  toast(n ? plural(n, 'jour') + ' ajouté' + (n > 1 ? 's' : '') : 'Historique déjà complet');
}
function onReset(){
  armOrRun($('#rst'), 'Tout effacer : touche encore', function doReset(){
    days = {}; requestFullWrite(); render(); closeSheet(); toast('Données effacées');
  });
}
function onVisibility(){
  if (document.hidden) return;
  if (key(today()) !== renderedDay){ renderedDay = key(today()); render(); }
  if (loaded && !fullWrite && !Object.keys(pending).length) loadData().then(render);
}

$('#months').onclick = onMonthsClick;
$('#years').onclick = onYearsClick;
$('#years').onkeydown = onYearsKey;
$('#bM').onclick = onModeMonth;
$('#bY').onclick = onModeYear;
$('#hex').onclick = onHexClick;
$('#nC').onclick = onNavCal;
$('#nS').onclick = onNavStats;
$('#chips').onclick = onChipsClick;
$('#sbody').onclick = onStatsClick;
$('#gear').onclick = openSheet;
$('#cls').onclick = closeSheet;
$('#sheet').onclick = onSheetBackdrop;
$('#exp').onclick = onExport;
$('#cpy').onclick = onCopy;
$('#imp').onclick = onImport;
$('#seed').onclick = onReseed;
$('#rst').onclick = onReset;
document.onvisibilitychange = onVisibility;

/* ---------- Démarrage : UI immédiate, puis auth, puis données ---------- */
function boot(){
  loadData().then(function afterLoad(){
    render();
    requestAnimationFrame(scrollToday);
    if (!meta.hint){ meta.hint = 1; queue('meta:hint', 1); setTimeout(function showHint(){ toast('Touche un jour pour le marquer'); }, 700); }
  });
}
render();
setCalMode('m');
firebase.auth().onAuthStateChanged(function onAuth(user){
  if (!user){
    window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname);
    return;
  }
  if (booted) return;
  booted = true;
  boot();
});
})();
</script>
</body>
